name: Authorization

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"

      - run: bun install --frozen-lockfile
      - run: uv sync --project server --frozen

      # NOTE: This offline suite includes Website Import coverage and must pass
      # before CI spends time starting the local Supabase stack.
      - name: Test backend (includes website imports)
        id: backend_tests
        env:
          # NOTE: Non-secret placeholders satisfy application settings; these
          # tests must not connect to Supabase.
          APP_ENV: test
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_KEY: ci-backend-test-key
          HOUSEHOLD_JOIN_CODE_HMAC_KEY: 0123456789abcdef0123456789abcdef
        run: bun run test:be

      - name: Start local Supabase
        run: bunx supabase start -x studio,imgproxy,realtime,mailpit,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Rebuild schema from migrations
        run: bunx supabase db reset

      - name: Test authorization
        run: bun run test:auth

      # NOTE: A successful backend step means Supabase startup may have been
      # attempted, so cleanup must still run after later failures.
      - name: Stop local Supabase
        if: ${{ always() && steps.backend_tests.outcome == 'success' }}
        run: bunx supabase stop --no-backup
